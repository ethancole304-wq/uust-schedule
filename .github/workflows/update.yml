name: update-schedule
on:
  schedule:
    - cron: "17 */3 * * *"   # мои группы — каждые 3 часа
    - cron: "40 21 * * *"    # все группы — раз в сутки, 02:40 по Уфе
  workflow_dispatch:
    inputs:
      mode:
        description: "tracked — мои группы, full — все"
        type: choice
        options: [tracked, full]
        default: tracked
  push:
    paths: ["tracked.json", "scripts/update.py", ".github/workflows/update.yml"]
permissions:
  contents: write
concurrency: update
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Обновить данные
        run: python -u scripts/update.py ${{ (github.event.schedule == '40 21 * * *' || inputs.mode == 'full') && 'full' || 'tracked' }}
      - name: Закоммитить
        run: |
          git config user.name "schedule-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "без изменений"; exit 0; fi
          git commit -q -m "data: обновление расписания"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
