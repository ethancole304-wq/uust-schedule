name: update-schedule
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  push:
    paths: ["tracked.json", "scripts/update.py", ".github/workflows/update.yml"]
permissions:
  contents: write
concurrency: update
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update.py
      - run: |
          git config user.name "schedule-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || (git commit -m "data: обновление расписания" && git push)
