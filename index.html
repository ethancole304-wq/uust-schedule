<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Расписание УУНиТ</title>
<script src="https://telegram.org/js/telegram-web-app.js?59"></script>
<style>
:root{
  --bg:var(--tg-theme-secondary-bg-color,#f2f3f7);
  --card:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,#ffffff));
  --text:var(--tg-theme-text-color,#14161a);
  --hint:var(--tg-theme-hint-color,#8a8f98);
  --accent:var(--tg-theme-button-color,#2f7cf6);
  --accent-text:var(--tg-theme-button-text-color,#ffffff);
  --link:var(--tg-theme-link-color,var(--accent));
  --sep:color-mix(in srgb,var(--hint) 18%,transparent);
  --soft:color-mix(in srgb,var(--hint) 10%,transparent);
  --radius:18px;
  --safe-top:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));
  --safe-bottom:max(env(safe-area-inset-bottom),var(--tg-safe-area-inset-bottom,0px));
  --c-lec:#3b82f6;--c-pr:#10b981;--c-lab:#8b5cf6;--c-mil:#f59e0b;--c-ex:#ef4444;--c-zach:#14b8a6;--c-cons:#64748b;--c-def:#94a3b8;
}
@media (prefers-color-scheme:dark){
  :root:not(.tg){--bg:#0f1115;--card:#181b21;--text:#eef0f4;--hint:#8b919c;--accent:#5b9cff}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{flex:none}
.wrap{max-width:560px;margin:0 auto;padding:0 14px calc(28px + var(--safe-bottom))}

.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + var(--safe-top)) 14px 8px;margin:0 -14px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:14px;background:linear-gradient(var(--bg),transparent);pointer-events:none}
.head{display:flex;align-items:center;gap:10px}
.who{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;padding:2px 0}
.who small{color:var(--hint);font-size:12px;font-weight:500;letter-spacing:.02em;text-transform:uppercase}
.who b{display:flex;align-items:center;gap:6px;font-size:22px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who b span{overflow:hidden;text-overflow:ellipsis}
.who b svg{color:var(--hint)}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--card);display:grid;place-items:center;color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.iconbtn:active{transform:scale(.94)}
.today-btn{height:40px;padding:0 14px;border-radius:12px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-weight:600;font-size:14px;display:none}
.today-btn.show{display:block}

.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:12px;padding:3px;margin-top:12px}
.seg button{height:32px;border-radius:9px;font-size:13px;font-weight:600;color:var(--hint);transition:background .15s,color .15s}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.weekbar{display:flex;align-items:center;justify-content:space-between;margin:10px 0 8px}
.weekbar .lbl{font-weight:600;font-size:14px}
.weekbar .lbl em{font-style:normal;color:var(--hint);font-weight:500;margin-left:6px}
.arrow{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--hint)}
.arrow:active{background:var(--soft)}

.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.day{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 9px;border-radius:14px;background:var(--card);transition:background .18s,color .18s,transform .12s}
.day:active{transform:scale(.95)}
.day .dn{font-size:11px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.04em}
.day .dd{font-size:18px;font-weight:700;letter-spacing:-.02em}
.day .dots{display:flex;gap:2px;height:4px;margin-top:2px}
.day .dots i{width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:.55}
.day.today .dn{color:var(--accent)}
.day.sel{background:var(--accent);color:var(--accent-text)}
.day.sel .dn{color:color-mix(in srgb,var(--accent-text) 75%,transparent)}
.day.sel .dots i{background:var(--accent-text);opacity:.8}
.day.off .dd{color:var(--hint)}
body.v-week .days,body.v-exam .days,body.v-exam .weekbar{display:none}

.pager{overflow:hidden;margin-top:16px;touch-action:pan-y}
.page{transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .22s}
.page.out-l{transform:translateX(-24px);opacity:0}
.page.out-r{transform:translateX(24px);opacity:0}
.daytitle{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 10px}
.daytitle h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.daytitle span{color:var(--hint);font-size:13px}

.now{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--radius);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,var(--card)),var(--card));margin-bottom:12px;border:1px solid color-mix(in srgb,var(--accent) 22%,transparent)}
.now .pulse{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent);animation:pulse 1.8s infinite;flex:none}
.now.idle .pulse{animation:none;opacity:.5}
.now .tx{flex:1;min-width:0}
.now .tx b{display:block;font-size:14px}
.now .tx span{color:var(--hint);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .big{font-weight:700;font-size:15px;color:var(--accent);white-space:nowrap}
@keyframes pulse{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}

.lesson{position:relative;display:flex;gap:12px;background:var(--card);border-radius:var(--radius);padding:14px 14px 14px 12px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03);cursor:pointer;transition:transform .12s}
.lesson:active{transform:scale(.985)}
.lesson::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.lesson.past{opacity:.5}
.lesson.pastday{opacity:.7}
.lesson.cur{box-shadow:0 0 0 2px var(--accent),0 8px 24px -12px color-mix(in srgb,var(--accent) 60%,transparent)}
.time{width:50px;flex:none;display:flex;flex-direction:column;align-items:flex-start;padding-left:6px}
.time b{font-size:16px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.time span{color:var(--hint);font-size:13px;font-variant-numeric:tabular-nums}
.time em{margin-top:6px;font-style:normal;font-size:11px;font-weight:700;color:var(--hint);background:var(--soft);border-radius:6px;padding:1px 6px}
.body{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border-radius:7px;padding:2px 8px;margin-bottom:6px}
.subj{font-size:16px;font-weight:650;line-height:1.3;letter-spacing:-.01em;word-break:break-word}
.meta{display:flex;flex-direction:column;gap:5px;margin-top:9px}
.row{display:flex;align-items:flex-start;gap:7px;font-size:14px;color:var(--hint);min-width:0}
.row svg{margin-top:2px;opacity:.85}
.row .v{color:var(--text);opacity:.85;word-break:break-word;text-align:left}
.row .v small{color:var(--hint);opacity:1;font-size:13px}
.row.note .v{color:var(--accent);opacity:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.link{color:var(--link)!important;opacity:1!important}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--soft)}
.prog i{display:block;height:100%;background:var(--accent);border-radius:0 3px 3px 0}

.gap{display:flex;align-items:center;gap:10px;color:var(--hint);font-size:12px;margin:8px 6px}
.gap::before,.gap::after{content:"";flex:1;height:1px;background:var(--sep)}
.gap.win{color:color-mix(in srgb,var(--c-mil) 85%,var(--text));font-weight:600}
.sp10{height:10px}

.wday{background:var(--card);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.wday.today{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 50%,transparent)}
.wday h3{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px;font-size:15px;font-weight:700;width:100%;text-align:left}
.wday h3 span{color:var(--hint);font-size:12px;font-weight:500}
.wrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 0;border-top:1px solid var(--sep)}
.wrow:first-of-type{border-top:0}
.wrow i{width:4px;height:28px;border-radius:2px;background:var(--c);flex:none}
.wrow b{width:44px;flex:none;font-size:14px;font-variant-numeric:tabular-nums}
.wrow .ws{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .wr{color:var(--hint);font-size:13px;white-space:nowrap}
.wrow.past{opacity:.55}
.wempty{color:var(--hint);font-size:14px}

.exhead{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--radius);background:linear-gradient(135deg,color-mix(in srgb,var(--c-ex) 14%,var(--card)),var(--card));margin-bottom:14px}
.exhead .big{font-size:28px;font-weight:800;color:var(--c-ex);letter-spacing:-.03em}
.exhead .tx b{display:block;font-size:14px}
.exhead .tx span{color:var(--hint);font-size:13px}
.exdate{margin:16px 4px 8px;font-size:14px;font-weight:700}
.exdate span{color:var(--hint);font-weight:500;margin-left:6px}

.empty{text-align:center;padding:44px 20px;background:var(--card);border-radius:var(--radius)}
.empty .em{font-size:44px;line-height:1}
.empty b{display:block;font-size:17px;margin-top:12px}
.empty span{color:var(--hint);font-size:14px}

.sk{background:var(--card);border-radius:var(--radius);height:104px;margin-bottom:10px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,var(--soft),transparent);animation:sh 1.2s infinite}
@keyframes sh{to{transform:translateX(100%)}}

.actions{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:18px}
.pill{display:none;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:14px;background:var(--card);color:var(--accent);font-weight:600;font-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.pill.show{display:flex}
.foot{text-align:center;color:var(--hint);font-size:12px;margin-top:16px}
.foot a{color:var(--link);text-decoration:none}
.offline{display:none;margin:0 auto 4px;color:var(--c-mil);font-size:12px;font-weight:600;text-align:center}
.offline.show{display:block}

.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);transform:translateY(100%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s;display:flex;flex-direction:column}
.sheet.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s}
.sbar{padding:calc(14px + var(--safe-top)) 14px 10px;max-width:560px;width:100%;margin:0 auto}
.sbar h3{margin:0 0 10px;font-size:20px;letter-spacing:-.02em}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 12px;height:46px;color:var(--hint)}
.search input{flex:1;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:16px;height:100%}
.search input::placeholder{color:var(--hint)}
.results{flex:1;overflow:auto;padding:4px 14px 30px;max-width:560px;width:100%;margin:0 auto}
.rs-h{color:var(--hint);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:14px 4px 8px}
.res{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;background:var(--card);border-radius:14px;margin-bottom:6px}
.res:active{transform:scale(.985)}
.res .av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.res .nm{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .tp{color:var(--hint);font-size:12px}
.res .tp.vpn{color:var(--c-mil)}
.hint{color:var(--hint);text-align:center;padding:30px 10px;font-size:14px}
.err{color:var(--c-ex)}

.lsheet{position:fixed;inset:0;z-index:30;visibility:hidden;transition:visibility 0s .25s}
.lsheet.open{visibility:visible;transition:none}
.lback{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .25s}
.lsheet.open .lback{opacity:1}
.lpanel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + var(--safe-bottom));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow:auto}
.lsheet.open .lpanel{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 12px}
.lpanel .subj{font-size:20px;margin-bottom:12px}
.lpanel .meta{gap:9px;margin:0 0 14px}
.lpanel .row{font-size:15px}
textarea{width:100%;min-height:96px;resize:vertical;border:0;outline:0;border-radius:14px;padding:12px;background:var(--bg);color:var(--text);font:inherit;font-size:15px}
.lhint{color:var(--hint);font-size:12px;margin-top:6px}
</style>
</head>
<body class="v-day">
<div class="wrap">
  <div class="top">
    <div class="head">
      <button class="who" id="who" aria-label="Сменить группу">
        <small id="whoKind">Расписание</small>
        <b><span id="whoTitle">Выбери группу</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></b>
      </button>
      <button class="today-btn" id="todayBtn">Сегодня</button>
      <button class="iconbtn" id="searchBtn" aria-label="Поиск"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    </div>
    <div class="seg" id="seg"><button data-v="day" class="on">День</button><button data-v="week">Неделя</button><button data-v="exam">Сессия</button></div>
    <div class="weekbar">
      <button class="arrow" id="prevW" aria-label="Предыдущая неделя"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="lbl" id="weekLbl">&nbsp;</div>
      <button class="arrow" id="nextW" aria-label="Следующая неделя"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <div class="days" id="days"></div>
  </div>
  <div class="pager" id="pager"><div class="page" id="page"></div></div>
  <div class="actions">
    <div class="offline" id="offline"></div>
    <button class="pill" id="notifyBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>Напоминания и изменения</button>
    <button class="pill" id="homeBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M12 8v6M9 11h6"/></svg>Добавить на главный экран</button>
  </div>
  <div class="foot">Данные: <a href="https://schedule.uust.ru" id="orig" target="_blank" rel="noopener">schedule.uust.ru</a></div>
</div>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sbar">
    <h3>Чьё расписание?</h3>
    <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Группа или фамилия преподавателя" autocomplete="off" enterkeyhint="search"></label>
  </div>
  <div class="results" id="results"></div>
</div>

<div class="lsheet" id="lsheet" aria-hidden="true">
  <div class="lback" id="lback"></div>
  <div class="lpanel">
    <div class="grab"></div>
    <div id="lbody"></div>
    <textarea id="note" placeholder="Заметка или домашка к этой паре…"></textarea>
    <div class="lhint" id="lhint">Сохраняется автоматически и видна на всех твоих устройствах в Telegram</div>
  </div>
</div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var inTg = !!(tg && tg.initData);
  var v8 = inTg && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0");
  if (inTg) {
    document.documentElement.classList.add("tg");
    tg.ready(); tg.expand();
    try { tg.setHeaderColor("secondary_bg_color"); tg.setBackgroundColor("secondary_bg_color"); } catch (e) {}
    try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
    try { if (v8 && /ios|android/.test(tg.platform)) tg.requestFullscreen(); } catch (e) {}
  }
  function haptic(k) { try { if (k === "sel") tg.HapticFeedback.selectionChanged(); else tg.HapticFeedback.impactOccurred(k || "light"); } catch (e) {} }

  var BOT = "RadmirAkhtyamov_bot";
  var STATIC = /github\.io$/.test(location.hostname);
  var LIVE = "https://uust-schedule-bot.ethancole304.workers.dev";
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  var DAY = 864e5, TZ = 5;
  var WD = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
  var WDF = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота", "Воскресенье"];
  var MON = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
  var MONS = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
  var HOL = { "1-1": 1, "1-7": 1, "2-23": 1, "3-8": 1, "5-1": 1, "5-9": 1, "6-12": 1, "11-4": 1 };
  var TYPES = {
    "Лекция": ["--c-lec", "Лекция"], "Практика (семинар)": ["--c-pr", "Практика"], "Лабораторная работа": ["--c-lab", "Лабораторная"],
    "Военная подготовка": ["--c-mil", "Военная подготовка"], "Экзамен": ["--c-ex", "Экзамен"], "Зачет": ["--c-zach", "Зачёт"], "Зачёт": ["--c-zach", "Зачёт"],
    "Консультация": ["--c-cons", "Консультация"]
  };
  var EXAM_RE = /экзам|зач[её]т|консульт|курсов|аттестац/i;
  function typeOf(y) {
    if (TYPES[y]) return TYPES[y];
    if (/экзам/i.test(y || "")) return ["--c-ex", y];
    if (/зач[её]т/i.test(y || "")) return ["--c-zach", y];
    return ["--c-def", y || "Занятие"];
  }
  var SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">';
  var ICON = {

  function anyOpen() { return $("sheet").classList.contains("open") || $("lsheet").classList.contains("open"); }
  function updateBack() {
    if (!tg || !tg.BackButton) return;
    if (anyOpen() || st.stack.length) tg.BackButton.show(); else tg.BackButton.hide();
  }
  function back() {
    if ($("lsheet").classList.contains("open")) return closeLesson();
    if ($("sheet").classList.contains("open")) return closeSheet();
    var prev = st.stack.pop();
    if (prev) { st.sel = prev.sel; st.view = prev.view; load(prev.ent, false); }
    updateBack();
  }

  // ---------- поиск ----------
  var qTimer = null, qSeq = 0;
  function openSheet() {
    $("sheet").classList.add("open"); $("sheet").setAttribute("aria-hidden", "false");
    $("q").value = ""; showHistory(); updateBack(); loadIdx().catch(function () {});
    setTimeout(function () { $("q").focus(); }, 250);
  }
  function closeSheet() {
    if (!st.ent) return;
    $("sheet").classList.remove("open"); $("sheet").setAttribute("aria-hidden", "true");
    $("q").blur(); updateBack();
  }
  function avColor(k) { return k === 1 ? "linear-gradient(135deg,#a78bfa,#7c3aed)" : "linear-gradient(135deg,#60a5fa,#2563eb)"; }
  function avText(k, t) { return k === 1 ? t.split(" ").slice(0, 2).map(function (s) { return s[0]; }).join("") : t.replace(/[^А-ЯA-Z]/g, "").slice(0, 2) || "Гр"; }
  function resRow(k, id, t) {
    var ok = offlineOk(k, id);
    return '<button class="res" data-k="' + k + '" data-id="' + id + '" data-title="' + esc(t) + '"><span class="av" style="background:' + avColor(k) + '">' + esc(avText(k, t)) + '</span><span class="nm">' + esc(t) + '</span><span class="tp' + (ok ? "" : " vpn") + '">' + (ok ? (k === 1 ? "преподаватель" : "группа") : "нужен VPN") + "</span></button>";
  }
  function showHistory() {
    var hist = lsGet("hist", []);
    $("results").innerHTML = hist.length
      ? '<div class="rs-h">Недавние</div>' + hist.map(function (h) { return resRow(h.kind, h.id, h.title); }).join("")
      : '<div class="hint">Начни вводить номер группы, например <b>ПРО-403</b>,<br>или фамилию преподавателя</div>';
  }
  function doSearch(q) {
    var seq = ++qSeq;
    if (!q.trim()) return showHistory();
    $("results").innerHTML = '<div class="hint">Ищу…</div>';
    searchIdx(q).then(function (r) {
      if (seq !== qSeq) return;
      $("results").innerHTML = r.length ? '<div class="rs-h">Найдено</div>' + r.map(function (x) { return resRow(x[0], x[1], x[2]); }).join("") : '<div class="hint">Ничего не нашлось 🤷</div>';
    }).catch(function () { $("results").innerHTML = '<div class="hint err">Поиск недоступен без связи</div>'; });
  }

  // ---------- карточка пары и заметка ----------
  var openKey = null, noteTimer = null;
  function openLesson(i) {
    var c = st.cards[i]; if (!c) return;
    var x = c.x, n = c.n, tc = typeOf(x.y);
    openKey = noteKey(x, n);
    $("lbody").innerHTML = '<div style="--c:var(' + tc[0] + ')"><div class="chip">' + esc(tc[1]) + '</div></div><div class="subj">' + esc(x.s || "—") + '</div><div class="meta">' + metaRows(x, n, true).join("") + "</div>";
    $("note").value = NOTES[openKey] || "";
    $("lhint").textContent = cs ? "Сохраняется автоматически и видна на всех твоих устройствах в Telegram" : "Сохраняется автоматически на этом устройстве";
    $("lsheet").classList.add("open"); $("lsheet").setAttribute("aria-hidden", "false");
    haptic("light"); updateBack();
  }
  function closeLesson() {
    if (openKey) { clearTimeout(noteTimer); saveNote(openKey, $("note").value); }
    openKey = null;
    $("note").blur();
    $("lsheet").classList.remove("open"); $("lsheet").setAttribute("aria-hidden", "true");
    updateBack(); renderMain();
  }

  // ---------- события ----------
  $("seg").addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) setView(b.dataset.v); });
  $("days").addEventListener("click", function (e) { var b = e.target.closest(".day"); if (b) go(+b.dataset.n); });
  $("prevW").onclick = function () { st.sel -= 7; haptic("sel"); render(-1); };
  $("nextW").onclick = function () { st.sel += 7; haptic("sel"); render(1); };
  $("todayBtn").onclick = function () { var t = todayN(); if (wdOf(t) === 7) t++; if (st.view === "day") go(t); else { st.sel = t; render(); } };
  $("who").onclick = openSheet; $("searchBtn").onclick = openSheet;
  $("q").addEventListener("input", function (e) { clearTimeout(qTimer); qTimer = setTimeout(function () { doSearch(e.target.value); }, 180); });
  $("results").addEventListener("click", function (e) {
    var b = e.target.closest(".res"); if (!b) return;
    haptic("light");
    var ent = { kind: +b.dataset.k, id: +b.dataset.id, title: b.dataset.title };
    st.stack = [];
    $("sheet").classList.remove("open"); $("q").blur();
    load(ent, false);
  });
  function openTeacher(b) {
    haptic("light");
    if ($("lsheet").classList.contains("open")) closeLesson();
    st.view = st.view === "exam" ? "exam" : "day";
    load({ kind: 1, id: +b.dataset.t, title: b.dataset.tn }, true);
  }
  $("page").addEventListener("click", function (e) {
    var t = e.target.closest("[data-t]"); if (t) return openTeacher(t);
    var h = e.target.closest("h3[data-n]"); if (h) { st.sel = +h.dataset.n; return setView("day"); }
    var c = e.target.closest("[data-i]"); if (c) openLesson(+c.dataset.i);
  });
  $("lbody").addEventListener("click", function (e) { var t = e.target.closest("[data-t]"); if (t) openTeacher(t); });
  $("lback").onclick = closeLesson;
  $("note").addEventListener("input", function () { var k = openKey, v = $("note").value; clearTimeout(noteTimer); noteTimer = setTimeout(function () { if (k) saveNote(k, v); }, 500); });
  if (tg && tg.BackButton) tg.BackButton.onClick(back);
  $("notifyBtn").onclick = function () {
    haptic("light");
    var link = "https://t.me/" + BOT + "?start=n_" + st.ent.kind + "_" + st.ent.id;
    try { tg.openTelegramLink(link); } catch (e) { location.href = link; }
  };

  var sx = null, sy = null;
  $("pager").addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  $("pager").addEventListener("touchend", function (e) {
    if (sx == null || st.view === "exam") return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (st.view === "week") { st.sel += dx < 0 ? 7 : -7; haptic("sel"); render(dx < 0 ? 1 : -1); }
      else go(st.sel + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
    }
  }, { passive: true });

  setInterval(function () { if (st.data && !anyOpen() && st.view !== "exam") renderMain(); }, 30000);
  function refresh() {
    var ent = st.ent; if (!ent || !st.data) return;
    fetchSchedule(ent).then(function (raw) {
      if (st.ent !== ent) return;
      st.offline = false;
      if (raw !== st.raw) { applyData(raw); writeCache(ent, raw); render(); } else renderHeader();
    }).catch(function () {});
  }
  var hiddenAt = 0;
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) hiddenAt = Date.now();
    else if (Date.now() - hiddenAt > 60000) refresh();
  });

  // ---------- старт ----------
  st.view = lsGet("view", "day"); if (["day", "week", "exam"].indexOf(st.view) < 0) st.view = "day";
  if (wdOf(st.sel) === 7) st.sel++;
  function fallback() { var u = urlEnt(); if (u) load(u); else { render(); openSheet(); } }
  var saved = lsGet("ent", null);
  if (saved) load(saved);
  else if (cs) {
    render();
    cs.getItem("ent", function (err, v) {
      var e = null; try { e = v ? JSON.parse(v) : null; } catch (x) {}
      if (e) load(e); else fallback();
    });
  } else fallback();
  syncNotes();

  // ---------- ярлык на главный экран ----------
  var hb = $("homeBtn");
  if (v8 && tg.checkHomeScreenStatus) {
    try {
      tg.checkHomeScreenStatus(function (s) { if (s === "missed" || s === "unknown") hb.classList.add("show"); });
      tg.onEvent("homeScreenAdded", function () { hb.classList.remove("show"); });
    } catch (e) {}
    hb.onclick = function () { haptic("light"); try { tg.addToHomeScreen(); } catch (e) {} };
  }

  // ---------- офлайн-оболочка ----------
  if (STATIC && "serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js"); } catch (e) {} }
})();
</script>
</body>
</html>
